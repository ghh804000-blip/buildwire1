name: buildwire
description: "Desain dan simulasi panel listrik"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.2
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  file_selector: ^1.1.0
  url_launcher: ^6.3.3
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  desktop_drop: ^0.8.4
  pasteboard: ^0.6.0
  image: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/devices/
    - assets/symbols/
    - assets/sounds/
    - assets/zelio/
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/BarlowCondensed-OFL.txt
    - assets/licenses/QElectroTech-ELEMENTS.LICENSE
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    # Nameplate and wire-marker labels: a condensed DIN-like face, like the lettering printed on panel parts.
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
